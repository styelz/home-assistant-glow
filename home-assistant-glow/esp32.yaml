---
# Home Assistant Glow
#
# Read your electricity meter by means of the pulse LED on your
# meter, useful if you do not have a serial port (P1).
# © Klaas Schoute
#
substitutions:
  device_name: home-assistant-glow
  friendly_name: Home Assistant Glow
  project_version: "4.2.3"
  device_description: "Measure your energy consumption with the pulse LED on your smart meter - ESP32 Generic"

  # Define the GPIO pins
  pulse_pin: GPIO26
  status_led: GPIO5
  led_pin_red: GPIO2
  led_pin_green: GPIO4
  pulse_debounce_time: 150ms

  # Pulse rate configuration (imp/kWh)
  # Common values: 1000, 3200, 5000, 10000
  # Check your meter for the correct imp/kWh value
  pulse_rate: "3200"

esphome:
  name: '${device_name}'
  comment: '${device_description}'
  name_add_mac_suffix: true
  min_version: 2024.6.0
  project:
    name: "klaasnicolaas.home-assistant-glow"
    version: "${project_version}"

dashboard_import:
  package_import_url: github://styelz/home-assistant-glow/home-assistant-glow/esp32.yaml@develop

esp32:
  board: esp32dev
  framework:
    type: arduino

packages:
  remote_package:
    url: https://github.com/styelz/home-assistant-glow/
    ref: "4.2.3"
    files:
      - components/basis.yaml
      - components/status_led.yaml
      - components/pulse_meter.yaml

# Enable logging
logger:

# Allow provisioning Wi-Fi via serial
improv_serial:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.1.28
  # Set up a wifi access point
  ap:
    ssid: '${friendly_name}'

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device via WiFi AP.
captive_portal:

# Local Web Server running on port 80
web_server:
  id: esphome_web_server
  version: 3

api:
  encryption:
    key: !secret glow_api_key

# OTA configuration #
ota:
  - platform: esphome
    id: ota_esphome
    password: !secret glow_ota_password