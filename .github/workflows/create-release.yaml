name: Create Release

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      tag_number:
        description: 'Tag number for the release (e.g., 4.2.4). Leave empty to use the last existing tag'
        required: false
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag number from input or use last tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_number }}" ]; then
            TAG="${{ github.event.inputs.tag_number }}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "")
            if [ -z "$TAG" ]; then
              echo "Error: No tag specified and no existing tags found"
              exit 1
            fi
          fi
          echo "tag_number=${TAG}" >> $GITHUB_OUTPUT
          echo "Tag number: ${TAG}"

      - name: Check if tag already exists
        id: check_tag
        continue-on-error: true
        run: |
          if git rev-parse "${{ steps.tag.outputs.tag_number }}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Delete existing release if it exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ steps.tag.outputs.tag_number }}" --yes --cleanup-tag 2>/dev/null || true

      - name: Delete existing tag from remote if it exists
        run: |
          git push origin --delete "${{ steps.tag.outputs.tag_number }}" 2>/dev/null || true

      - name: Delete existing local tag if it exists
        run: |
          git tag -d "${{ steps.tag.outputs.tag_number }}" 2>/dev/null || true

      - name: Create Git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "${{ steps.tag.outputs.tag_number }}"
          git push origin "${{ steps.tag.outputs.tag_number }}"

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "${{ steps.tag.outputs.tag_number }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
