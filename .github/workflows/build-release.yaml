name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_number:
        description: 'Tag number for the release (e.g., 4.2.4)'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get tag number from input or use timestamp
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_number }}" ]; then
            TAG="${{ github.event.inputs.tag_number }}"
          else
            TAG="release-$(date +%Y%m%d-%H%M%S)"
          fi
          echo "tag_number=${TAG}" >> $GITHUB_OUTPUT
          echo "Tag number: ${TAG}"

      - name: Check if tag already exists
        id: check_tag
        continue-on-error: true
        run: |
          if git rev-parse "v${{ steps.tag.outputs.tag_number }}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Delete existing release if it exists
        if: steps.check_tag.outputs.tag_exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "v${{ steps.tag.outputs.tag_number }}" --yes --cleanup-tag || true

      - name: Delete existing tag if it exists
        if: steps.check_tag.outputs.tag_exists == 'true'
        run: |
          git push origin --delete "v${{ steps.tag.outputs.tag_number }}" || true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install ESPHome
        run: |
          pip install esphome

      - name: Build ESP8266 firmware
        run: |
          cd home-assistant-glow
          esphome compile esp8266.yaml
          mkdir -p ../build
          cp .esphome/build/home-assistant-glow/.pioenvs/home-assistant-glow/firmware.bin ../build/esp8266-firmware.bin

      - name: Build ESP32 firmware
        run: |
          cd home-assistant-glow
          esphome compile esp32.yaml
          cp .esphome/build/home-assistant-glow/.pioenvs/home-assistant-glow/firmware.bin ../build/esp32-firmware.bin

      - name: Create Git tag
        run: |
          git tag "v${{ steps.tag.outputs.tag_number }}"
          git push origin "v${{ steps.tag.outputs.tag_number }}"

      - name: Create release with artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ steps.tag.outputs.tag_number }}"
          files: |
            build/esp8266-firmware.bin
            build/esp32-firmware.bin
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
